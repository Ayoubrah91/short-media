<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts2.local.css">
<link rel="stylesheet" href="fonts/fonts.local.css">
<style>
:root{--bg:#F6F6F6;--ink:#1F1F1F;--muted:#8E8E8E;--light:#C9C9C9;--coral:#FF385C;--coral2:#E31C5F;--tint:#FFE8EC;--ok:#00A699;--no:#E5484D;--card:#FFFFFF;
 --sans:'Inter Tight','Inter',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:var(--sans);color:var(--ink);
 background:radial-gradient(ellipse 70% 45% at 50% 38%,#FFFFFF 0%,#F7F7F7 60%,#EFEFEF 100%)}
.blob{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,56,92,.10) 0%,rgba(255,56,92,.04) 40%,rgba(255,56,92,0) 70%)}
.spark{position:absolute;color:#C8C8C8;font-size:18px;line-height:1}
.spark.c{color:#FFB3C1}
/* header */
#hdr{position:absolute;top:58px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:22px;z-index:20}
.pill{background:#fff;border-radius:40px;padding:12px 26px;font-weight:800;font-size:22px;letter-spacing:1.5px;box-shadow:0 6px 20px rgba(0,0,0,.06);display:flex;align-items:center;gap:12px}
.pill .dot{width:12px;height:12px;border-radius:50%;background:var(--coral)}
.pill .ep{color:var(--muted);font-weight:700}
#prog{display:flex;gap:10px}
#prog i{display:block;width:56px;height:7px;border-radius:4px;background:#DCDCDC}
/* beats */
.beat{position:absolute;left:0;right:0;top:180px;height:1000px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.card{background:var(--card);border-radius:34px;box-shadow:0 20px 60px rgba(0,0,0,.08),0 3px 10px rgba(0,0,0,.04)}
.chap{display:flex;flex-direction:column;align-items:center;gap:26px}
.chap .num{position:relative;font-weight:900;font-size:300px;letter-spacing:-14px;line-height:.85}
.chap .num i{position:absolute;left:-14px;right:-6px;bottom:18px;height:92px;background:var(--coral);z-index:-1;border-radius:10px;transform-origin:left center}
.chap .lab{background:var(--ink);color:#fff;font-weight:800;font-size:56px;padding:14px 34px;border-radius:20px}
.tile{width:230px;height:230px;border-radius:52px;background:#fff;box-shadow:0 18px 50px rgba(0,0,0,.09);display:flex;align-items:center;justify-content:center;position:relative}
.tile svg{width:120px;height:120px}
.tile.on{background:var(--coral)}
.tile.on svg *{stroke:#fff}
.tile.off{opacity:.35}
.tlab{margin-top:22px;font-weight:800;font-size:40px;background:#fff;padding:8px 24px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:repeat(2,250px);gap:60px 90px}
.gitem{display:flex;flex-direction:column;align-items:center}
.gitem .tile{width:200px;height:200px;border-radius:46px}
.gitem .tile svg{width:100px;height:100px}
.gitem .tlab{font-size:34px;box-shadow:none;background:transparent}
.ck{position:absolute;top:-14px;right:-14px;width:54px;height:54px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;border:5px solid #fff}
.ck svg{width:28px!important;height:28px!important}
.ck svg *{stroke:#fff!important}
.chip{position:absolute;display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:12px 22px;font-weight:800;font-size:32px;box-shadow:0 10px 30px rgba(0,0,0,.10);white-space:nowrap}
.chip.coral{background:var(--coral);color:#fff}
.chip.dark{background:var(--ink);color:#fff}
.chip svg{width:34px;height:34px}
.chip.coral svg *,.chip.dark svg *{stroke:#fff}
/* gauge */
.gauge{position:relative;width:520px;height:520px}
.gauge svg{width:520px;height:520px;transform:rotate(-90deg)}
.gauge .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:150px;letter-spacing:-6px}
.gauge .v small{font-size:70px;margin-left:6px;letter-spacing:0}
.glab{margin-top:30px;font-weight:800;font-size:44px}
/* list card */
.lc{width:860px;padding:44px 48px}
.lc h4{font-size:46px;font-weight:800;margin-bottom:18px}
.row{display:flex;align-items:center;gap:22px;font-size:38px;font-weight:700;padding:20px 0;border-top:2px solid #F0F0F0}
.row:first-of-type{border-top:0}
.row .t{flex:1}
.mk{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.mk.ok{background:var(--ok)} .mk.no{background:var(--no)}
.mk svg{width:30px;height:30px} .mk svg *{stroke:#fff}
/* results */
.res{width:820px;padding:34px}
.q{display:flex;align-items:center;gap:14px;background:#F4F4F4;border-radius:22px;padding:18px 24px;font-size:30px;font-weight:700;color:#555;margin-bottom:20px}
.q svg{width:34px;height:34px}
.rlist{position:relative;height:560px}
.rr{position:absolute;left:0;right:0;height:120px;display:flex;align-items:center;gap:22px;padding:0 18px;border-radius:24px}
.rr .th{width:96px;height:84px;border-radius:18px;flex:none}
.rr .ln{flex:1;display:flex;flex-direction:column;gap:12px}
.rr .ln i{display:block;height:16px;border-radius:8px;background:#ECECEC}
.rr .rt{font-weight:800;font-size:30px;color:#555}
.rr.you{background:var(--tint);outline:4px solid var(--coral)}
.rr.you .ln b{font-size:30px;font-weight:800}
/* price receipt */
.rc{width:820px;padding:48px 52px}
.pl{display:flex;justify-content:space-between;font-size:44px;font-weight:700;padding:18px 0;border-bottom:2px dashed #EAEAEA}
.pl .lb{color:#555}
.ptot{display:flex;justify-content:space-between;align-items:baseline;margin-top:26px}
.ptot .lb{font-size:40px;font-weight:800}
.ptot .val{font-size:120px;font-weight:900;letter-spacing:-4px;color:var(--coral)}
.psub{text-align:right;font-size:34px;font-weight:700;color:var(--muted)}
/* compare */
.cmp{display:flex;gap:40px;align-items:flex-end}
.cc{width:400px;padding:40px 36px;text-align:center}
.cc .k{font-size:38px;font-weight:800;color:#555}
.cc .big{font-size:110px;font-weight:900;letter-spacing:-4px;margin:16px 0 4px}
.cc .s{font-size:32px;font-weight:700;color:var(--muted)}
.cc.bad .big{color:var(--coral)} .cc.good .big{color:var(--ok)}
/* waterfall */
.wf{width:880px;padding:44px 48px}
.wrow{display:flex;align-items:center;gap:20px;margin:16px 0}
.wrow .wl{width:300px;font-size:32px;font-weight:800;text-align:right}
.wrow .wb{flex:1;height:64px;position:relative}
.wrow .wb i{position:absolute;top:0;bottom:0;border-radius:14px}
.wtot{margin-top:24px;display:flex;justify-content:space-between;align-items:center;font-size:44px;font-weight:900}
.wtot .q2{font-size:110px;color:var(--coral);font-weight:900}
/* stars */
.st{width:720px;padding:46px 50px}
.st .top{display:flex;justify-content:space-between;align-items:center}
.st .nm{font-size:40px;font-weight:800}
.st .val{font-size:96px;font-weight:900;letter-spacing:-3px}
.stars{display:flex;gap:18px;margin-top:22px}
.stars svg{width:96px;height:96px}
/* medal */
.medal{position:relative;width:420px;height:520px}
.conf{position:absolute;width:16px;height:30px;border-radius:4px}
/* podium */
.pod{display:flex;align-items:flex-end;gap:36px}
.pb{width:220px;border-radius:26px 26px 10px 10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:26px;font-weight:900;color:#fff;transform-origin:bottom}
.pb .p1{font-size:34px;font-weight:800;opacity:.9}
.pb .p2{font-size:84px;letter-spacing:-3px}
/* clock */
.clk{width:640px;padding:60px 40px;text-align:center}
.clk .tm{font-size:220px;font-weight:900;letter-spacing:-10px;line-height:1}
.clk .sub{font-size:40px;font-weight:800;color:var(--muted);margin-top:10px}
/* phone */
.ph{width:440px;height:820px;border-radius:70px;background:#1F1F1F;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.18)}
.ph .scr{width:100%;height:100%;border-radius:52px;background:#fff;display:flex;flex-direction:column;align-items:center;padding-top:80px}
.ph .lk{width:150px;height:150px;border-radius:44px;background:var(--tint);display:flex;align-items:center;justify-content:center}
.ph .lk svg{width:90px;height:90px}
.ph .code{display:flex;gap:18px;margin-top:60px}
.ph .code b{width:70px;height:96px;border-radius:20px;background:#F2F2F2;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:900}
.ph .ok2{margin-top:60px;font-size:40px;font-weight:900;color:var(--ok)}
/* chat */
.chat{width:820px;padding:40px}
.bub{background:#F3F3F3;border-radius:30px 30px 30px 8px;padding:24px 30px;font-size:36px;font-weight:700;margin:14px 0;width:fit-content;max-width:90%}
.bub.me{background:var(--coral);color:#fff;border-radius:30px 30px 8px 30px;margin-left:auto}
.phs{display:flex;gap:16px;margin-top:16px}
.phs i{display:block;width:200px;height:150px;border-radius:22px}
/* subscribe */
.sub-btn{display:flex;align-items:center;gap:20px;background:var(--coral);color:#fff;font-weight:900;font-size:72px;padding:30px 60px;border-radius:40px;box-shadow:0 20px 50px rgba(255,56,92,.35)}
.sub-btn svg{width:70px;height:70px}
.sub-btn svg *{stroke:#fff}
.nxt{margin-top:60px;display:flex;align-items:center;gap:28px;padding:34px 40px;width:760px}
.nxt .ic{width:110px;height:110px;border-radius:30px;background:var(--tint);display:flex;align-items:center;justify-content:center;flex:none}
.nxt .ic svg{width:64px;height:64px}
.nxt .k{font-size:26px;font-weight:800;letter-spacing:2px;color:var(--muted)}
.nxt .v{font-size:46px;font-weight:900;line-height:1.1;margin-top:6px}
.cursor{position:absolute;width:80px;height:80px;z-index:30}
/* apartment illustration */
.apt{width:820px;padding:24px;border-radius:40px}
.apt svg{display:block;width:100%;border-radius:26px}
.apt .cap{font-size:34px;font-weight:800;padding:20px 10px 6px}
/* captions */
#cap{position:absolute;left:60px;right:60px;top:1230px;height:260px}
.ph2{position:absolute;inset:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:4px 18px;text-align:center}
.w{font-size:64px;font-weight:600;color:#A3A3A3;letter-spacing:-1px;display:inline-block}
.w.em{color:var(--ink);font-weight:850}
.w.cor{color:var(--coral);font-weight:850}
.brand{display:flex;flex-direction:column;align-items:center;padding:60px 90px 54px;margin-top:40px}
.brand .bic{width:160px;height:160px;border-radius:44px;background:var(--coral);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px rgba(255,56,92,.35)}
.brand .bic svg{width:100px;height:100px}
.brand .bname{font-size:124px;font-weight:900;letter-spacing:-4px;margin-top:30px;line-height:1}
.brand .bname span{color:var(--coral)}
.brand .btag{margin-top:24px;font-size:46px;font-weight:800;color:var(--muted)}

/* ===== AD: Bayto ===== */
.hero{display:flex;flex-direction:column;align-items:center}
.hero .kick{background:var(--ink);color:#fff;font-weight:800;font-size:46px;padding:14px 34px;border-radius:20px;letter-spacing:3px;margin-bottom:34px}
.hero .l1{font-size:190px;font-weight:900;letter-spacing:-9px;line-height:.92}
.hero .l2{position:relative;font-size:210px;font-weight:900;letter-spacing:-10px;line-height:.92;color:#fff;padding:6px 38px 20px;margin-top:12px}
.hero .l2 i{position:absolute;inset:0;background:var(--coral);border-radius:26px;transform-origin:left center;z-index:0}
.hero .l2 span{position:relative;z-index:1}
.hero .hsub{margin-top:46px;font-size:60px;font-weight:850;color:var(--ink);text-align:center;line-height:1.1}
.bax{width:990px;padding:22px 22px 26px;border-radius:44px}
.frm{position:relative;width:946px;height:631px;border-radius:28px;overflow:hidden;background:#ddd}
.frm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frm .af{opacity:0}
.frm .fl{position:absolute;inset:-10%;background:linear-gradient(110deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.85) 50%,rgba(255,255,255,0) 65%);opacity:0}
.tg{position:absolute;top:24px;left:24px;padding:10px 22px;border-radius:16px;font-weight:900;font-size:30px;letter-spacing:2px;color:#fff}
.tg.tb{background:rgba(20,20,20,.62)}
.tg.ta{background:var(--coral);opacity:0;transform-origin:left center}
.cap2{display:flex;align-items:center;gap:18px;justify-content:center;margin-top:24px;font-size:52px;font-weight:900}
.cap2 svg{width:60px;height:60px;background:var(--ok);border-radius:18px;padding:10px}
.cam{position:relative;width:1000px;height:520px;border-radius:84px;background:#141414;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.22)}
.cam .scr{position:relative;width:100%;height:100%;border-radius:68px;overflow:hidden;background:#000}
.cam .vf{position:absolute;left:92px;top:0;bottom:0;width:726px;overflow:hidden}
.cam .vf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
.cam .vf i{position:absolute;background:rgba(255,255,255,.38)}
.cam .vf .g1{left:33.33%;top:0;bottom:0;width:2px}.cam .vf .g2{left:66.66%;top:0;bottom:0;width:2px}
.cam .vf .g3{top:33.33%;left:0;right:0;height:2px}.cam .vf .g4{top:66.66%;left:0;right:0;height:2px}
.cam .zm{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;background:rgba(0,0,0,.30);padding:10px;border-radius:44px}
.cam .zm b{width:74px;height:74px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center}
.cam .zm b.act{color:#FFD60A;font-size:27px;background:rgba(0,0,0,.8)}
.cam .side{position:absolute;right:0;top:0;bottom:0;width:146px;display:flex;align-items:center;justify-content:center}
.cam .shut{width:104px;height:104px;border-radius:50%;background:#fff;box-shadow:0 0 0 7px #000,0 0 0 12px #fff}
.cam .lft{position:absolute;left:0;top:0;bottom:0;width:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.cam .lft span{width:14px;height:14px;border-radius:50%;background:#FFD60A}
.cam .lft b{color:#fff;font-size:20px;font-weight:800;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:3px}
.upl{width:900px;padding:36px 40px 34px;background:#F7F2EA;border-radius:44px;box-shadow:0 26px 70px rgba(0,0,0,.14)}
.uh{display:flex;justify-content:space-between;align-items:center}
.ulogo{display:flex;align-items:center;gap:14px;font-size:52px;font-weight:700;letter-spacing:-3px;color:#111216}
.ulogo svg{width:62px;height:62px}
.ulogo i{font-style:normal;color:#FFB547}
.un{font-size:30px;font-weight:700;color:#8a8070}
.dz{margin-top:26px;height:290px;border:4px dashed #E2D4BC;border-radius:30px;position:relative;display:flex;align-items:center;justify-content:center}
.dzt{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:27px;font-weight:700;color:#9b8f7c}
.th{display:flex;gap:16px;margin-top:-34px}
.tt{width:186px;height:124px;border-radius:16px;background-size:cover;background-position:center;box-shadow:0 10px 24px rgba(0,0,0,.20);opacity:0}
.ubtn{margin-top:28px;display:flex;align-items:center;justify-content:center;gap:16px;background:linear-gradient(180deg,#ffc76b,#ffb547);color:#111216;font-size:48px;font-weight:850;padding:28px;border-radius:28px;box-shadow:0 14px 34px rgba(255,181,71,.45)}
.ubtn svg{width:50px;height:50px}
.ubar{margin-top:26px;height:22px;border-radius:12px;background:#E9DFCF;overflow:hidden}
.ubar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFB547,#FF385C);border-radius:12px}
.ust{margin-top:16px;text-align:center;font-size:32px;font-weight:800;color:#5c5446;opacity:0}
.blogo{position:relative;width:900px;height:640px;border-radius:52px;background:#0B0C10;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 30px 80px rgba(0,0,0,.28)}
.blogo .glw{position:absolute;width:760px;height:760px;left:70px;top:-300px;background:radial-gradient(circle,rgba(255,181,71,.42),rgba(255,181,71,0) 65%)}
.blogo .lg{position:relative;width:220px;height:220px}
.blogo .lg svg{width:220px;height:220px}
.blogo .wm{position:relative;margin-top:28px;font-size:164px;font-weight:700;letter-spacing:-11px;line-height:1;color:#F7F2EA}
.blogo .wm i{font-style:normal;color:#FFB547;margin-left:-4px}
.blogo .tl{position:relative;margin-top:26px;font-size:44px;font-weight:700;color:rgba(247,242,234,.75);letter-spacing:.5px}
.g6{display:grid;grid-template-columns:repeat(2,450px);gap:24px}
.gc{position:relative;width:450px;height:300px;border-radius:26px;background-size:cover;background-position:center;box-shadow:0 14px 34px rgba(0,0,0,.14)}
.gck{position:absolute;right:14px;top:14px;width:58px;height:58px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;border:4px solid #fff}
.gck svg{width:30px;height:30px}
.gend{background:var(--coral);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;font-size:50px;font-weight:900;text-align:center;line-height:1.05;padding:20px}
.gend svg{width:84px;height:84px}
.ofr{display:flex;align-items:center;gap:40px;padding:56px 76px}
.ofr .on{font-size:330px;font-weight:900;letter-spacing:-14px;line-height:.8;color:var(--coral)}
.ofr .o1{font-size:104px;font-weight:900;line-height:1;letter-spacing:-3px}
.ofr .o2{font-size:104px;font-weight:900;line-height:1;letter-spacing:-3px;color:var(--coral)}
.orow{display:flex;gap:22px;margin-top:44px}
.orow .chip{position:relative}
.ourl{margin-top:40px;display:flex;align-items:center;gap:20px;background:#0B0C10;color:#F7F2EA;font-size:56px;font-weight:800;padding:20px 40px;border-radius:28px;letter-spacing:-1px}
.ourl svg{width:70px;height:70px}
.brand .bic.blg{background:transparent;box-shadow:none}
.brand .bic.blg svg{width:160px;height:160px}
</style>
</head>
<body>
<div id="stage">
 <div id="bg"></div>
 <div id="hdr"><div class="pill"><span class="dot"></span><span id="series">LOCATION COURTE DURÉE</span><span class="ep" id="ep">· ÉP. 1</span></div><div id="prog"></div></div>
 <div id="beats"></div>
 <div id="cap"></div>
</div>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eOut=x=>1-Math.pow(1-x,3);
const eBack=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const h=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const S='stroke="#FF385C" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"';
const IC={
 house:`<svg viewBox="0 0 24 24"><path ${S} d="M3.5 11.5 12 4l8.5 7.5"/><path ${S} d="M6 10v9.5h12V10"/><path ${S} d="M10 19.5v-5h4v5"/></svg>`,
 star:`<svg viewBox="0 0 24 24"><path ${S} d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8L3.5 9.7l5.9-.8z"/></svg>`,
 chat:`<svg viewBox="0 0 24 24"><path ${S} d="M4 5.5h16v10H9l-4.5 3.5V5.5z"/><path ${S} d="M8 9.5h8M8 12.5h5"/></svg>`,
 ban:`<svg viewBox="0 0 24 24"><circle ${S} cx="12" cy="12" r="8"/><path ${S} d="M6.5 6.5l11 11"/></svg>`,

   if(b.label){const cp=h('div','cap2',icon('check','#FFFFFF')+'<span>'+esc(b.label)+'</span>');c.appendChild(cp);add(cp,'pop',rv+0.12,{b})}

 if(T==='cam'){const c=h('div','cam');c.innerHTML=`<div class="scr"><div class="lft"><span></span><b>PHOTO</b></div><div class="vf"><img src="${b.img}"><i class="g1"></i><i class="g2"></i><i class="g3"></i><i class="g4"></i><div class="zm"><b data-z="2">2</b><b data-z="1" class="act">1×</b><b data-z="05">0,5</b></div></div><div class="side"><div class="shut"></div></div></div>`;
   box.appendChild(c);add(c,'pop',b.at,{b});add(c,'zoomcam',b.zoomAt,{b,s0:b.s0||1.9});if(b.shootAt!=null)add(c,'shoot',b.shootAt,{b})}
 if(T==='upload'){const c=h('div','upl');
   c.innerHTML=`<div class="uh"><span class="ulogo">${LOGO}<b>bayto<i>.</i></b></span><span class="un">${esc(b.title||'Nouvelle annonce')}</span></div><div class="dz"><div class="th"></div><div class="dzt">${esc(b.hint||'Dépose tes photos · HEIC · JPG · PNG')}</div></div><div class="ubtn">${icon('bolt','#111216')}<span>${esc(b.btn||'Transformer mes photos')}</span></div><div class="ubar"><i></i></div><div class="ust">${esc(b.status||'Bayto retouche tes photos…')}</div>`;
   const th=c.querySelector('.th');(b.thumbs||[]).forEach((src,i)=>{const im=h('div','tt');im.style.backgroundImage=`url("${src}")`;th.appendChild(im);add(im,'drop',(b.dropAt??b.at+0.3)+i*0.16,{b,rot:[-8,6,-5,7][i%4]})});
   box.appendChild(c);add(c,'pop',b.at,{b});
   const btn=c.querySelector('.ubtn');add(btn,'press',b.clickAt,{b});add(c.querySelector('.ubar i'),'bar',b.clickAt+0.12,{b,dur:b.barDur||1.3});add(c.querySelector('.ust'),'pop',b.clickAt+0.2,{b});
   const cur=h('div','cursor',IC.cursor);box.appendChild(cur);add(cur,'cursorTo',b.clickAt-0.62,{b,x0:b.cx0??900,y0:b.cy0??940,x1:b.cx1??600,y1:b.cy1??700})}
 if(T==='logo'){const c=h('div','blogo',`<div class="glw"></div><div class="lg">${LOGO}</div><div class="wm">bayto<i>.</i></div><div class="tl">${esc(b.tag||'Le studio photo de ta location')}</div>`);box.appendChild(c);add(c,'pop',b.at,{b});add(c.querySelector('.lg'),'medal',b.logoAt??b.at+0.1,{b});add(c.querySelector('.wm'),'pop',(b.logoAt??b.at+0.1)+0.15,{b});add(c.querySelector('.tl'),'pop',b.tagAt??b.at+0.6,{b})}
 if(T==='grid6'){const g=h('div','g6');(b.imgs||[]).forEach((src,i)=>{const t=h('div','gc');t.style.backgroundImage=`url("${src}")`;const ck=h('div','gck',icon('check','#FFFFFF'));t.appendChild(ck);g.appendChild(t);add(t,'pop',b.at+0.08+i*0.11,{b});add(ck,'pop',b.at+0.3+i*0.11,{b})});
   const last=h('div','gc gend',`${icon('check','#FFFFFF')}<span>${esc(b.endText||'Prêtes pour Airbnb')}</span>`);g.appendChild(last);add(last,'pop',b.endAt??b.at+0.8,{b});box.appendChild(g)}
 if(T==='offer'){const c=h('div','card ofr',`<div class="on">${esc(b.num||'3')}</div><div class="ot"><div class="o1">${esc(b.l1||'photos')}</div><div class="o2">${esc(b.l2||'offertes')}</div></div>`);box.appendChild(c);add(c,'pop',b.at,{b});
   const row=h('div','orow');(b.tags||[]).forEach((tg,i)=>{const e=chip(tg.text,tg.icon,tg.kind);row.appendChild(e);add(e,'pop',(tg.at??b.at+0.5)+i*0.15,{b})});box.appendChild(row);
   if(b.url){const u=h('div','ourl',`${LOGO}<span>${esc(b.url)}</span>`);box.appendChild(u);add(u,'pop',b.urlAt??b.at+0.9,{b})}}
 (b.chips||[]).forEach(c=>placeChip(b,c,box));
 return box;
}

function buildCaptions(words){
 const ws=words.map(w=>({text:w[0],s:w[1],e:w[2]})).filter(w=>!/^\[.*\]$/.test(w.text)&&/[\p{L}\p{N}%€]/u.test(w.text));
 const emph=new Set((SPEC.emph||[]).map(x=>x.toLowerCase()));const cor=new Set((SPEC.coral||[]).map(x=>x.toLowerCase()));
 ws.forEach(w=>{w.end=/[.!?…]$/.test(w.text);w.comma=/[,:;]$/.test(w.text);const k=w.text.toLowerCase().replace(/[.,!?…:;«»"]/g,'');w.em=emph.has(k);w.cor=cor.has(k)});
 const glue=new Set(['la','le','les',"l'",'de','du','des',"d'",'à','au','aux','un','une','et','ou','ton','ta','tes','ce','cette','ces','en','par','pour','sur','dans','avec','que','qui','ne','ni','tu','te','je','ma','mon','pas','plus','moins','au']);
 let cur=[];const out=[];const flush=()=>{if(cur.length){out.push({words:cur,start:cur[0].s,end:cur[cur.length-1].e});cur=[]}};
 ws.forEach(w=>{if(cur.length&&w.s-cur[cur.length-1].e>0.5)flush();cur.push(w);const t=w.text.replace(/[.,!?…:;]+$/,'').toLowerCase();if((w.end||(w.comma&&cur.length>=2)||cur.length>=5)&&!glue.has(t))flush()});flush();
 return out;
}

function init(spec){
 SPEC=spec;
 document.getElementById('ep').textContent=spec.epLabel!=null?spec.epLabel:(spec.ep===0?'':'· ÉP. '+(spec.ep||1));
 if(spec.series)document.getElementById('series').textContent=spec.series;
 const bg=document.getElementById('bg');
 [[120,420,700],[960,1100,760],[200,1700,640]].forEach(([x,y,s],i)=>{const b=h('div','blob');b.style.cssText=`width:${s}px;height:${s}px;left:${x-s/2}px;top:${y-s/2}px`;bg.appendChild(b);parts.push({el:b,i,blob:1,x,y})});
 for(let i=0;i<34;i++){const p=h('div','spark'+(i%5===0?' c':''),i%3===0?'+':'·');const x=(i*263)%1080,y=(i*517)%1920;p.style.left=x+'px';p.style.top=y+'px';p.style.fontSize=(i%3===0?22:34)+'px';bg.appendChild(p);parts.push({el:p,i,x,y})}
 const pr=document.getElementById('prog');SPEC._seg=[];for(let i=0;i<(spec.chapters||[]).length;i++){const s=h('i');pr.appendChild(s);SPEC._seg.push(s)}
 spec.beats.forEach((b,i)=>{b.end=i<spec.beats.length-1?spec.beats[i+1].at:spec.duration;document.getElementById('beats').appendChild(build(b))});
 beats=spec.beats;
 phrases=buildCaptions(spec.words);
 const cap=document.getElementById('cap');
 phrases.forEach(p=>{p.el=h('div','ph2');p.words.forEach(w=>{const s=h('span','w'+(w.cor?' cor':w.em?' em':''),esc(w.text));w.el=s;p.el.appendChild(s)});cap.appendChild(p.el)});
}

function seek(t){
 parts.forEach(p=>{if(p.blob){p.el.style.transform=`translate(${Math.sin(t*.3+p.i)*50}px,${Math.cos(t*.25+p.i)*40}px)`}else{p.el.style.transform=`translate(${Math.sin(t*.5+p.i)*14}px,${-((t*12+p.i*37)%60)}px)`;p.el.style.opacity=0.4+0.6*Math.abs(Math.sin(t*.8+p.i))}});
 // progress
 const ch=SPEC.chapters||[];SPEC._seg.forEach((s,i)=>{const a=ch[i],b=ch[i+1]??1e9;s.style.background=t>=b?'#FF385C':(t>=a?'#1F1F1F':'#DCDCDC')});
 document.getElementById('prog').style.opacity=ch.length&&t>=ch[0]-0.3?1:0;
 let act=null;
 beats.forEach(b=>{const on=t>=b.at&&t<b.end;b.el.style.display=on?'flex':'none';if(!on)return;act=b;const pin=clamp((t-b.at)/0.35),pout=clamp((b.end-t)/0.25);const o=Math.min(eOut(pin),pout);b.el.style.opacity=o;b.el.style.filter=o<1?`blur(${(1-o)*14}px)`:'none';b.el.style.transform=`scale(${b.sc*(0.94+0.06*eOut(pin))})`});
 anims.forEach(a=>{if(a.b!==act)return;const e=a.el,dt=t-a.at;
  switch(a.kind){
   case 'pop':{const p=clamp(dt/0.42);e.style.opacity=clamp(dt/0.18);e.style.transform=`translateY(${(1-eBack(p))*40}px) scale(${0.85+0.15*eBack(p)})`;e.style.filter=p<1?`blur(${(1-p)*8}px)`:'none';break}
   case 'slide':{const p=clamp(dt/0.35);e.style.opacity=eOut(p);e.style.transform=`translateX(${(1-eOut(p))*-40}px)`;break}
   case 'grow':{const p=clamp(dt/0.45);e.style.transform=`scaleX(${eOut(p)})`;e.style.transformOrigin='left center';break}
   case 'on':{if(dt>=0)e.classList.add('on');else e.classList.remove('on');break}
   case 'off':{if(dt>=0)e.classList.add('off');else e.classList.remove('off');break}
   case 'orbit':{const p=clamp(dt/0.8);const ang=a.i*0.7+p*1.2;const r=60+eOut(p)*260;e.style.opacity=dt<0?0:1-clamp((dt-1.4)/0.6);e.style.transform=`translate(${Math.cos(ang)*r-60}px,${Math.sin(ang)*r*0.55-120}px)`;break}
   case 'gauge':{const p=eOut(clamp(dt/a.dur));const v=a.from+(a.to-a.from)*p;e.querySelector('.n').textContent=v.toFixed(a.dec).replace('.',',');e.querySelector('.arc').setAttribute('stroke-dashoffset',a.C*(1-v/a.max));break}
   case 'rowpos':{const rise=a.riseAt!=null&&dt>=0?eOut(clamp((t-a.riseAt)/0.7)):0;const base=a.i,target=a.i+1;const pos=base+(target-base)*rise;e.style.top=(pos*130)+'px';e.style.opacity=1;break}
   case 'you':{const p=clamp(dt/0.35);const rise=a.riseAt!=null?eOut(clamp((t-a.riseAt)/0.7)):0;e.style.top=((a.n)*130*(1-rise))+'px';e.style.opacity=eOut(p);e.style.transform=`scale(${1+0.04*Math.sin(clamp((t-(a.riseAt||0))/0.7)*Math.PI)})`;break}
   case 'stars':{const p=eOut(clamp(dt/a.dur));const v=a.to*p;e.querySelector('.val').textContent=v.toFixed(1).replace('.',',');e.querySelectorAll('.stars path').forEach((s,i)=>s.setAttribute('fill',v>=i+0.75?'#FF385C':'#ECECEC'));break}
   case 'medal':{const p=clamp(dt/0.6);e.style.opacity=clamp(dt/0.2);e.style.transform=`scale(${0.3+0.7*eBack(p)}) rotate(${(1-eOut(p))*-25}deg)`;break}
   case 'confetti':{const p=clamp(dt/1.6);const ang=(a.i/26)*Math.PI*2;const r=eOut(p)*(380+(a.i%5)*40);e.style.opacity=dt<0?0:1-clamp((dt-1.0)/0.6);e.style.transform=`translate(${Math.cos(ang)*r}px,${Math.sin(ang)*r*0.8+p*p*240-200}px) rotate(${dt*400+a.i*30}deg)`;break}
   case 'rise':{const p=clamp(dt/0.6);e.style.opacity=clamp(dt/0.2);e.style.transform=`scaleY(${eBack(p)})`;break}
   case 'digit':{e.textContent=dt>=0?e.dataset.d:'';e.style.background=dt>=0?'#FFE8EC':'#F2F2F2';break}
   case 'subscribed':{if(dt>=0){e.innerHTML=icon('check')+'<span>Abonné</span>';e.style.background='#1F1F1F';e.style.transform=`scale(${1+0.08*Math.sin(clamp(dt/0.3)*Math.PI)})`}else{e.innerHTML=icon('bell')+'<span>S\'abonner</span>';e.style.background=''}break}
   case 'reveal':{const af=e.querySelector('.af'),fl=e.querySelector('.fl'),tb=e.querySelector('.tb'),ta=e.querySelector('.ta');const p=clamp(dt/0.45);af.style.opacity=dt<0?0:eOut(p);af.style.transform=`scale(${dt<0?1.08:1.08-0.08*eOut(clamp(dt/0.9))})`;const q=clamp(dt/0.55);fl.style.opacity=(dt<0||q>=1)?0:0.9;fl.style.transform=`translateX(${-110+220*eOut(q)}%)`;tb.style.opacity=dt<0?1:1-clamp(dt/0.2);ta.style.opacity=dt<0?0:clamp(dt/0.2);ta.style.transform=`scale(${dt<0?0.8:0.8+0.2*eBack(clamp(dt/0.35))})`;break}
   case 'kb':{e.style.transform=`scale(${1+0.05*clamp(dt/3)})`;break}
   case 'zoomcam':{const img=e.querySelector('.vf img');const p=dt<0?0:eOut(clamp(dt/0.7));img.style.transform=`scale(${a.s0+(1-a.s0)*p})`;e.querySelectorAll('.zm b').forEach(x=>x.classList.toggle('act',dt>=0?x.dataset.z==='05':x.dataset.z==='1'));break}
   case 'shoot':{const vf=e.querySelector('.vf');const q=clamp(dt/0.3);vf.style.filter=(dt>=0&&q<1)?`brightness(${1+1.6*(1-q)})`:'none';e.querySelector('.shut').style.transform=`scale(${dt>=0&&dt<0.18?0.88:1})`;break}
   case 'drop':{const p=clamp(dt/0.55);e.style.opacity=dt<0?0:clamp(dt/0.12);e.style.transform=`translateY(${(1-eBack(p))*-260}px) rotate(${(1-eOut(p))*a.rot*2.5+a.rot*0.35}deg)`;break}
   case 'press':{const q=clamp(dt/0.3);e.style.transform=`scale(${dt>=0?1-0.06*Math.sin(q*Math.PI):1})`;e.style.filter=dt>=0?'brightness(1.06)':'none';break}
   case 'bar':{e.style.width=(dt<0?0:eOut(clamp(dt/a.dur))*100)+'%';break}
   case 'cursorTo':{const p=eOut(clamp(dt/0.6));e.style.opacity=dt<0?0:1;e.style.left=(a.x0+(a.x1-a.x0)*p)+'px';e.style.top=(a.y0+(a.y1-a.y0)*p)+'px';const c=clamp((dt-0.62)/0.15);e.style.transform=`scale(${1-0.15*Math.sin(c*Math.PI)})`;break}
   case 'cursor':{const p=eOut(clamp(dt/0.6));e.style.opacity=dt<0?0:1;e.style.left=(760-220*p)+'px';e.style.top=(760-200*p)+'px';const c=clamp((dt-0.62)/0.15);e.style.transform=`scale(${1-0.15*Math.sin(c*Math.PI)})`;break}
  }});
 // captions
 let ci=-1;phrases.forEach((p,i)=>{if(t>=p.start-0.06)ci=i});
 phrases.forEach((p,i)=>{const on=i===ci&&t<p.end+1.2;p.el.style.display=on?'flex':'none';if(!on)return;
  p.words.forEach(w=>{const q=clamp((t-w.s+0.05)/0.16);w.el.style.opacity=q<=0?0:0.15+0.85*q;w.el.style.filter=q<1?`blur(${(1-q)*7}px)`:'none'})});
}
window.init=init;window.seek=seek;
</script>
